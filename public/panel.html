<!doctype html>
<html lang="az"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010622">
<title>DeX — Müəllim Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ac:#2f6cff;--ac2:#5aa0ff;--ac3:#9cc4ff;--bg0:#010628;--bg1:#04188a;--tx:#eaf1ff;--mu:#8fb0ff;--ln:rgba(79,140,255,.38);--ok:#3ee0a8;--wa:#ffb04d;--in:#58aef0;--bad:#ff5c86;--glow:.7;--rad:18px;--cols:4;--tdur:1;color-scheme:dark}
:root[data-theme=ice]{--ac:#18b6ff;--ac2:#63d6ff;--ac3:#b4ecff;--bg0:#00111f;--bg1:#03407a;--mu:#8fd3f0;--ln:rgba(60,190,255,.38)}
:root[data-theme=violet]{--ac:#8a5bff;--ac2:#b08cff;--ac3:#d8c6ff;--bg0:#0a0224;--bg1:#2a0f8c;--mu:#bba6ff;--ln:rgba(150,110,255,.4)}
:root[data-theme=green]{--ac:#14d98c;--ac2:#5df0b4;--ac3:#b6fadd;--bg0:#00150f;--bg1:#06603c;--mu:#8fe6c0;--ln:rgba(40,220,150,.38)}
:root[data-theme=red]{--ac:#ff3d63;--ac2:#ff7b95;--ac3:#ffc1cd;--bg0:#180209;--bg1:#7a0f2e;--mu:#ff9fb2;--ln:rgba(255,80,110,.4)}
:root[data-font=s]{font-size:14.5px}:root[data-font=m]{font-size:16px}:root[data-font=l]{font-size:18px}
:root[data-rad=sharp]{--rad:6px}:root[data-rad=round]{--rad:28px}
*,*::before,*::after{box-sizing:border-box}
html{font-size:16px;background:var(--bg0)}
body{margin:0;min-height:100vh;background:var(--bg0);color:var(--tx);font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;font-weight:500;font-size:1.08rem;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block}
:focus-visible{outline:2px solid var(--ac3);outline-offset:2px}
a{color:inherit;text-decoration:none}

/* ── Fon: neon çəp xətlər, işıq zolaqları, sağ altda halqa ───────────────────── */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;background:radial-gradient(55% 45% at 0% 100%,color-mix(in srgb,var(--ac) 60%,transparent),transparent 72%),radial-gradient(45% 40% at 100% 0%,color-mix(in srgb,var(--ac) 34%,transparent),transparent 72%),radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg0) 64%)}
.bg .band{position:absolute;left:-20%;width:150%;height:34vh;transform:rotate(-38deg);background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--ac) 26%,transparent) 45%,transparent);filter:blur(2px);opacity:.9}
.bg .b1{top:6vh;animation:bd 18s ease-in-out infinite alternate}
.bg .b2{top:46vh;left:-45%;animation:bd 24s ease-in-out infinite alternate-reverse}
.bg .ray{position:absolute;height:2px;width:150vmax;left:-30vmax;transform-origin:0 50%;background:linear-gradient(90deg,transparent,var(--ac2) 40%,var(--ac3) 50%,var(--ac2) 60%,transparent);box-shadow:0 0 calc(18px*var(--glow)*2) calc(2px*var(--glow)*2) var(--ac);opacity:calc(.25 + var(--glow)*.6);transform:rotate(-38deg);animation:rs var(--d,9s) ease-in-out infinite var(--dl,0s)}
.bg .r1{top:78vh}.bg .r2{top:58vh;--d:11s;--dl:-3s;height:1px}.bg .r3{top:92vh;--d:13s;--dl:-6s}.bg .r4{top:28vh;--d:12s;--dl:-2s;height:1px}.bg .r5{top:112vh;--d:10s;--dl:-5s}.bg .r6{top:6vh;--d:15s;--dl:-8s;height:1px;opacity:.3}
.bg .ring{position:absolute;right:-10vw;bottom:-9vh;width:46vw;max-width:760px;aspect-ratio:2.5/1;border-radius:50%;border:clamp(3px,.5vw,8px) solid transparent;border-top-color:var(--ac3);border-left-color:var(--ac2);border-right-color:color-mix(in srgb,var(--ac) 40%,transparent);transform:rotate(-28deg);filter:drop-shadow(0 0 calc(22px*var(--glow)*2) var(--ac));animation:rg 14s ease-in-out infinite alternate}
.bg .ring.r2b{width:36vw;right:-6vw;bottom:-5vh;opacity:.5;animation-duration:19s;animation-direction:alternate-reverse}
.bg .vig{position:absolute;inset:0;background:radial-gradient(80% 70% at 50% 40%,transparent 40%,#00000066 100%)}
.nofx .bg .ray,.nofx .bg .band,.nofx .bg .ring{animation:none}
.nofx .bg .ray:nth-of-type(n+3),.nofx .bg .ring.r2b{display:none}
@keyframes rs{0%,100%{opacity:calc(.12 + var(--glow)*.3);translate:-4vmax 0}50%{opacity:calc(.3 + var(--glow)*.65);translate:4vmax 0}}
@keyframes bd{from{translate:-3vw 0}to{translate:5vw 2vh}}
@keyframes rg{from{transform:rotate(-30deg) translate(0,0)}to{transform:rotate(-25deg) translate(-2vw,-1.5vh)}}

/* ── Üst panel (neon həb) ─────────────────────────────────────────────────── */
#top{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;max-width:calc(100vw - 20px)}
.pill-nav{position:relative;display:flex;align-items:center;gap:4px;height:74px;padding:0 22px;border-radius:40px;border:1.5px solid var(--ac);background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 22%,#020a30),color-mix(in srgb,var(--ac) 10%,#01072a));box-shadow:0 0 calc(26px*var(--glow)*2) color-mix(in srgb,var(--ac) 55%,transparent),inset 0 0 calc(24px*var(--glow)) color-mix(in srgb,var(--ac) 30%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3)}
.nofx .pill-nav{backdrop-filter:none}
.ni{position:relative;display:grid;place-items:center;width:64px;height:60px;border:0;background:none;border-radius:20px;color:#b9cdff;transition:color .25s,transform .35s cubic-bezier(.2,.9,.3,1.4),filter .25s}
.ni svg{width:30px;height:30px;fill:currentColor;transition:transform .35s cubic-bezier(.2,.9,.3,1.4),filter .3s}
.ni svg.st{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ni:hover{color:#fff;transform:translateY(-2px)}
.ni:hover svg{transform:scale(1.14);filter:drop-shadow(0 0 calc(10px*var(--glow)*2) var(--ac3))}
.ni.on{color:#fff}
.ni.on svg{filter:drop-shadow(0 0 calc(9px*var(--glow)*2) var(--ac3))}
.ni .lb{position:absolute;top:calc(100% + 14px);left:50%;transform:translate(-50%,-6px);white-space:nowrap;padding:5px 12px;border-radius:99px;font-size:.95rem;font-weight:600;letter-spacing:.3px;color:#fff;background:color-mix(in srgb,var(--ac) 35%,#020a30);border:1px solid var(--ln);box-shadow:0 6px 20px #0008;opacity:0;pointer-events:none;filter:blur(6px);transition:opacity .22s,transform .3s cubic-bezier(.2,.9,.3,1.3),filter .25s}
.ni:hover .lb,.labels .ni.on .lb,.ni:focus-visible .lb{opacity:1;transform:translate(-50%,0);filter:none}
.labels .ni .lb{opacity:.85;transform:translate(-50%,0);filter:none}
.sep{width:1.5px;height:42px;margin:0 12px;background:linear-gradient(transparent,var(--ac2),transparent);opacity:.75;flex:none}
.ind{position:absolute;left:0;bottom:-1px;height:3px;width:40px;border-radius:3px;background:var(--ac3);box-shadow:0 0 calc(14px*var(--glow)*2) 2px var(--ac2);transition:left calc(.55s*var(--tdur)) cubic-bezier(.2,.9,.25,1.15),width calc(.55s*var(--tdur)) cubic-bezier(.2,.9,.25,1.15),filter .3s;pointer-events:none}
.ind.top{top:-1px;bottom:auto}
.ind.mov{filter:blur(1.5px) brightness(1.4)}
.nb{position:absolute;right:8px;top:4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:.8rem;font-weight:700;display:grid;place-items:center;box-shadow:0 0 12px var(--bad);animation:nbp 2s ease-in-out infinite}
#bell.has svg{animation:swingb 5s ease-in-out infinite;transform-origin:50% 10%}
.noshake #bell.has svg{animation:none}
.pop{position:absolute;top:calc(100% + 16px);right:0;width:min(360px,calc(100vw - 24px));padding:12px;border-radius:20px;border:1.5px solid var(--ln);background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 18%,#020a30f2),#01072af2);box-shadow:0 20px 60px #000b,0 0 calc(30px*var(--glow)*2) color-mix(in srgb,var(--ac) 35%,transparent);backdrop-filter:blur(18px);animation:pin calc(.32s*var(--tdur)) cubic-bezier(.2,.9,.25,1.1);z-index:40}
.pop[hidden]{display:none}
.pop h4{margin:2px 4px 10px;font-size:1.15rem;letter-spacing:.4px}
#nt{width:min(340px,calc(100vw - 24px))}
#nt div.n{padding:10px 12px;border-radius:12px;border-bottom:1px solid #ffffff12;font-size:1rem}
#nt div.u{background:color-mix(in srgb,var(--ac) 26%,transparent)}
.clkbig{font-size:3rem;font-weight:700;letter-spacing:2px;line-height:1;text-shadow:0 0 18px var(--ac)}
.sw{display:flex;gap:10px;margin:10px 4px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #ffffff40;transition:transform .25s cubic-bezier(.2,.9,.3,1.5),box-shadow .25s}
.sw button:hover{transform:scale(1.2)}.sw button.on{border-color:#fff;box-shadow:0 0 16px currentColor;transform:scale(1.15)}
input[type=range]{accent-color:var(--ac2);width:100%}

/* ── Səhifə sahəsi ──────────────────────────────────────────────────────── */
#view{position:fixed;inset:0;z-index:1;overflow:auto;padding:112px max(16px,calc((100vw - 1480px)/2)) 64px;scrollbar-width:thin;scrollbar-color:var(--ac) transparent;will-change:transform,filter}
.hero{margin:6px 4px 22px}
.hero h1{margin:0;font-size:2.7rem;line-height:1.05;font-weight:700;letter-spacing:.5px;text-shadow:0 0 calc(24px*var(--glow)*2) color-mix(in srgb,var(--ac) 70%,transparent)}
.hero p{margin:6px 0 0;color:var(--mu);font-size:1.25rem}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:99px;border:1px solid var(--ln);background:color-mix(in srgb,var(--ac) 14%,transparent);font-size:1.02rem}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px currentColor;color:var(--ok)}
.chip i.w{background:var(--wa);color:var(--wa)}.chip i.b{background:var(--in);color:var(--in)}

.glass .pn,.glass .pc,.glass .md,.glass .secbtn{backdrop-filter:blur(10px)}
.pn{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 15%,#02104acc),#010a30cc);border:1.5px solid var(--ln);border-radius:var(--rad);padding:20px 22px;box-shadow:0 0 calc(18px*var(--glow)) color-mix(in srgb,var(--ac) 22%,transparent),inset 0 1px 0 #ffffff12;transition:transform .3s cubic-bezier(.2,.9,.3,1.2),border-color .25s,box-shadow .3s}
.pn:hover{border-color:var(--ac2);box-shadow:0 0 calc(30px*var(--glow)*1.3) color-mix(in srgb,var(--ac) 45%,transparent),inset 0 1px 0 #ffffff1c}
.hover3d .pn:hover{transform:translateY(-3px)}
.pn h3{margin:0 0 12px;font-size:1.55rem;font-weight:700;letter-spacing:.4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;font-size:1.08rem}
.pn.wide{grid-column:1/-1}
.compact .two{gap:12px}.compact .pn{padding:12px 16px}.compact .li{padding:6px 4px}.compact .hero{margin-bottom:12px}
.big{font-size:3.6rem;font-weight:700;letter-spacing:3px;text-shadow:0 0 22px var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}.li .sp,.sp{min-width:0}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #ffffff14;transition:background .2s}
.li:last-child{border:0}.li:hover{background:#ffffff08}
.mu{color:var(--mu);font-size:1rem}
.bt{display:inline-flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--ac) 24%,#01072a);border:1px solid var(--ln);border-radius:14px;padding:8px 16px;font-size:1.05rem;font-weight:600;transition:transform .2s,background .2s,box-shadow .25s,border-color .2s}
.bt:hover{background:color-mix(in srgb,var(--ac) 42%,#01072a);border-color:var(--ac2);transform:translateY(-2px);box-shadow:0 8px 22px color-mix(in srgb,var(--ac) 40%,transparent)}
.bt:active{transform:scale(.95)}
.bt svg,.bt img{width:18px;height:18px}
.bt.pr{background:linear-gradient(180deg,var(--ac2),var(--ac));border-color:var(--ac3);color:#fff;box-shadow:0 0 calc(18px*var(--glow)*1.5) color-mix(in srgb,var(--ac) 60%,transparent)}
.bt.rd{background:#6f1230;border-color:#ff7a96}.bt.rd:hover{background:#951a42}
.in{background:#020a30cc;border:1px solid var(--ln);border-radius:12px;padding:9px 13px;min-width:0;flex:1;transition:border-color .2s,box-shadow .2s}
.in:focus{outline:none;border-color:var(--ac2);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 35%,transparent)}
textarea.in{width:100%;min-height:90px;resize:vertical}
select.in{flex:none}
.tg{width:52px;height:28px;border-radius:99px;border:1px solid var(--ln);background:#020a30;position:relative;padding:0;flex:none;transition:background .3s,box-shadow .3s,border-color .3s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#7fa6ff;transition:transform .35s cubic-bezier(.2,.9,.3,1.4),background .25s,box-shadow .3s}
.tg.on{background:linear-gradient(90deg,var(--ac),var(--ac2));border-color:var(--ac3);box-shadow:0 0 calc(14px*var(--glow)*1.5) color-mix(in srgb,var(--ac) 70%,transparent)}
.tg.on::after{transform:translateX(24px);background:#fff;box-shadow:0 0 10px #fff}
.ib2{background:none;border:0;padding:4px;color:#7fa6ff;transition:transform .2s,color .2s}
.ib2 svg{width:20px;height:20px}.ib2:hover{transform:scale(1.2) rotate(8deg);color:#fff}
.pill{font-size:.9rem;border-radius:99px;padding:2px 11px;background:color-mix(in srgb,var(--ac) 30%,transparent)}
.pill.bad{background:#6b1a33;color:#ffb3c4}
.pbar{height:6px;background:#0a1a52;border-radius:9px;overflow:hidden;width:120px}.pbar i{display:block;height:100%;background:var(--ac);width:0}
.ans{background:#0b3a2a;border:1px solid #1e8a5e;border-radius:12px;padding:8px 12px;color:#c9f2d8;width:100%}

/* ── Kompüter kartları ───────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:22px}
.pc{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 16%,#02104acc),#010a30dd);border:1.5px solid var(--ln);border-radius:var(--rad);padding:8px 8px 0;cursor:pointer;display:flex;flex-direction:column;position:relative;box-shadow:0 0 calc(16px*var(--glow)) color-mix(in srgb,var(--ac) 25%,transparent);transition:transform .35s cubic-bezier(.2,.9,.3,1.2),box-shadow .3s,border-color .2s}
.pc:hover{transform:translateY(-4px) scale(1.02);z-index:3;border-color:var(--ac3);box-shadow:0 16px 40px #000a,0 0 calc(34px*var(--glow)*1.4) color-mix(in srgb,var(--ac) 55%,transparent)}
.th{position:relative;border-radius:calc(var(--rad) - 6px);overflow:hidden;aspect-ratio:16/10;background:#020a30}
.th img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.pc:hover .th img{transform:scale(1.08)}
.th.off{filter:grayscale(.85) brightness(.7)}
.th::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,#ffffff22 50%,transparent 60%);transform:translateX(-120%);animation:sweep 7s ease-in-out infinite;animation-delay:calc(var(--i,0)*.35s)}
.noanim .th::after{display:none}
.ph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:4px;text-align:center;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--ac) 40%,#020a30),#010622 75%);color:#cfe0ff}
.ph b{font-size:1.5rem;font-weight:700}.ph small{font-size:1rem;color:var(--mu)}
.ph.big b{font-size:26px}.ph.big small{font-size:15px}
.lk{position:absolute;inset:0;background:#02071fcc;display:grid;place-content:center;justify-items:center;gap:4px;color:#ffb3c0;font-size:1.1rem}
.lk svg{width:30px;height:30px}
.ft{display:flex;align-items:center;gap:10px;height:48px;padding:0 4px 0 8px;font-size:1.12rem}
.ft span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft button{margin-left:auto;background:none;border:0;padding:6px;border-radius:10px;color:#9bbcff}.ft button svg{width:22px;height:22px}.ft button:hover{background:#ffffff18;color:#fff}
.d{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.d.g{background:var(--ok);animation:gp 2.6s ease-out infinite}.d.o{background:var(--wa);animation:blink 1.6s ease-in-out infinite}.d.b{background:var(--in)}
.nodot .d{animation:none}

/* ── Təhlükəsizlik rejimi (böyük düymə + açılan seçimlər) ────────────────── */
.secbtn{display:flex;align-items:center;gap:20px;width:100%;padding:20px 26px;text-align:left;border-radius:calc(var(--rad) + 6px);border:1.5px solid var(--ln);background:linear-gradient(100deg,color-mix(in srgb,var(--ac) 18%,#02104acc),#010a30cc);box-shadow:0 0 calc(20px*var(--glow)) color-mix(in srgb,var(--ac) 25%,transparent);transition:border-color .3s,box-shadow .35s,transform .3s cubic-bezier(.2,.9,.3,1.3);position:relative;overflow:hidden}
.secbtn::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#ffffff1c 50%,transparent 65%);transform:translateX(-120%);animation:sweep 6s ease-in-out infinite}
.secbtn:hover{transform:translateY(-2px)}
.secbtn.on{border-color:var(--ac3);box-shadow:0 0 calc(36px*var(--glow)*1.6) color-mix(in srgb,var(--ac) 60%,transparent)}
.secbtn .sh{width:74px;height:74px;flex:none;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 45%,transparent),transparent 70%);position:relative}
.secbtn .sh svg{width:42px;height:42px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px var(--ac2))}
.secbtn.on .sh::after{content:"";position:absolute;inset:4px;border-radius:50%;border:2px solid var(--ac3);animation:ring 2.2s ease-out infinite}
.secbtn:not(.on) .sh svg{stroke:#7f94c9;filter:none}
.secbtn .tt{flex:1;min-width:0;margin-left:4px}.secbtn .tt b{display:block;font-size:2rem;line-height:1.1;letter-spacing:.5px}.secbtn .tt span{color:var(--mu);font-size:1.1rem}
.secbtn .chev{width:14px;height:14px;border-right:3px solid var(--ac3);border-bottom:3px solid var(--ac3);transform:rotate(45deg);transition:transform .45s cubic-bezier(.2,.9,.3,1.3);margin:0 6px 4px 4px}
.secbtn.open .chev{transform:rotate(-135deg) translate(-3px,-3px)}
.secpanel{display:grid;grid-template-rows:0fr;transition:grid-template-rows calc(.55s*var(--tdur)) cubic-bezier(.2,.9,.25,1),opacity .4s,filter .4s;opacity:0;filter:blur(8px);margin-top:0}
.secpanel.open{grid-template-rows:1fr;opacity:1;filter:none;margin-top:18px}
.secpanel>.inner{overflow:hidden;min-height:0}
.secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px}
.opt{display:flex;align-items:center;gap:14px;padding:11px 4px;border-bottom:1px solid #ffffff12;transition:background .2s,transform .25s}
.opt:last-child{border:0}.opt:hover{background:#ffffff08;transform:translateX(3px)}
.opt .tx{flex:1;min-width:0}.opt .tx b{display:block;font-weight:600;font-size:1.08rem}.opt .tx small{display:block;color:var(--mu);font-size:.95rem;line-height:1.25}
.grp h3{display:flex;align-items:center;gap:10px}
.grp h3 .cnt{margin-left:auto;font-size:.95rem;font-weight:600;color:var(--ac3);background:color-mix(in srgb,var(--ac) 25%,transparent);padding:2px 12px;border-radius:99px}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:14px;background:#020a30;border:1px solid var(--ln);flex:none}
.seg button{border:0;background:none;padding:5px 13px;border-radius:11px;color:var(--mu);font-weight:600;transition:background .25s,color .25s,box-shadow .25s}
.seg button.on{background:linear-gradient(180deg,var(--ac2),var(--ac));color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--ac) 60%,transparent)}
.opt input[type=range]{width:170px;flex:none}

/* ── Parametrlər: alt tablar ─────────────────────────────────────────── */
.tabs{position:relative;display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px;padding:6px;border-radius:20px;border:1px solid var(--ln);background:#020a30aa;width:fit-content;max-width:100%}
.tabs button{position:relative;z-index:1;border:0;background:none;padding:8px 18px;border-radius:14px;font-weight:600;font-size:1.08rem;color:var(--mu);transition:color .25s,transform .25s}

async function cmd(pc,type,args,msg){try{const r=await post("/api/teacher/command",{pc,type,args});if(r.ok){if(msg!==null)toast(msg||`${r.sent} kompüterə göndərildi`);tick()}}catch(e){if(msg!==null)toast("Göndərilmədi, yenidən cəhd et")}}

// ── Live video (WebRTC) — only for the one PC window currently open, never the whole
// class list: the pupil's PC asks its own OS to share the screen, so this must stay
// scoped to a single, deliberate "I'm watching this one now" moment.
let RPC=null,RForPc="",RSeenOffer="";
function rtcStop(){if(RPC){try{RPC.close()}catch(e){}}RPC=null;RForPc="";RSeenOffer=""}
async function rtcHandle(pc,offerRaw){
 if(!offerRaw||pc!==MID)return;
 if(pc===RForPc&&offerRaw===RSeenOffer)return; // already answered this exact offer
 if(pc!==RForPc)rtcStop();
 RForPc=pc;RSeenOffer=offerRaw;
 try{
  const off=JSON.parse(offerRaw);
  const conn=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  RPC=conn;
  conn.ontrack=e=>{if(RPC!==conn||MID!==pc)return;const sc=$("#scr");if(!sc)return;let v=$("#scrvid");
   if(!v){const p=S.pcs.find(x=>x.id===pc);sc.innerHTML=`<video id="scrvid" class="rc" autoplay playsinline muted title="Siçanı idarə etmək üçün klikləyin"></video>`+(p?ovl(p):"");v=$("#scrvid")}
   if(v.srcObject!==e.streams[0])v.srcObject=e.streams[0];
   // Şagird ekranını paylaşmağı dayandırdıqda (OS-un öz "Stop sharing" düyməsindən və ya
   // başqa səbəbdən) dərhal bil və köhnə kadrda donub qalma — adi ekran şəklinə qayıt.
   e.track.addEventListener("ended",()=>{if(RPC!==conn)return;rtcStop();const vv=$("#scrvid");if(vv)vv.remove();toast("Şagird ekran paylaşımını dayandırdı");lastSig="";render(true)})};
  conn.addEventListener("connectionstatechange",()=>{if(RPC===conn&&["failed","disconnected","closed"].includes(conn.connectionState)){rtcStop();const vv=$("#scrvid");if(vv)vv.remove();lastSig="";render(true)}});
  await conn.setRemoteDescription(off);
  const answer=await conn.createAnswer();
  await conn.setLocalDescription(answer);
  await new Promise(res=>{if(conn.iceGatheringState==="complete")return res();const ch=()=>{if(conn.iceGatheringState==="complete"){conn.removeEventListener("icegatheringstatechange",ch);res()}};conn.addEventListener("icegatheringstatechange",ch);setTimeout(res,2500)});
  if(RPC!==conn||pc!==MID)return;
  const ld=conn.localDescription;
  await cmd(pc,"rtcAnswer",{sdp:JSON.stringify({sdp:ld.sdp,type:ld.type})},null);
 }catch(e){console.error("[dex] rtc",e)}
}

// ── Remote mouse (click the live screen picture to control that PC) ────────────
// nx/ny are 0..1 fractions of the image, so the click lands correctly whatever
// that student's own screen resolution is (server + Rust side already expect this).
let mouseBusy=false;
function nxny(img,e){const r=img.getBoundingClientRect();return{nx:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),ny:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}
async function mouseCmd(action,e){const img=e.target;if(!MID||mouseBusy)return;const{nx,ny}=nxny(img,e);mouseBusy=true;try{await cmd(MID,"mouse",{nx,ny,action},null)}finally{mouseBusy=false}}

async function recStart(kind){
 if(RECSTATE)return;
 try{PSTREAM=kind==="camera"?await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720},audio:true}):await navigator.mediaDevices.getDisplayMedia({video:true,audio:true})}
 catch(e){toast(kind==="camera"?"Kamera/mikrofon açılmadı":"Ekran qeydi başlamadı");return}
 PCHUNKS=[];
 const type=window.MediaRecorder&&MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")?"video/webm;codecs=vp9,opus":"video/webm";
 PREC=new MediaRecorder(PSTREAM,{mimeType:type,videoBitsPerSecond:1500000});
 PREC.ondataavailable=e=>{if(e.data&&e.data.size)PCHUNKS.push(e.data)};
 PREC.onstop=()=>{
  PSTREAM.getTracks().forEach(t=>t.stop());
  const blob=new Blob(PCHUNKS,{type:"video/webm"}),url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="dex-qeyd-"+Date.now()+".webm";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),15000);
  const _k=RECSTATE,_n=a.download;PREC=null;PSTREAM=null;RECSTATE=null;noteFromRec(_k,_n);toast("Qeyd kompüterinə endirildi və notlara əlavə olundu");lastSig="";render(true)};
 const vt=PSTREAM.getVideoTracks()[0];if(vt)vt.addEventListener("ended",()=>recStop());
 PREC.start(1000);RECSTATE=kind;toast("Qeyd başladı");lastSig="";render(true)}
function recStop(){if(PREC&&PREC.state==="recording")PREC.stop()}

// ── Səs effektləri (WebAudio ilə sintez: whoosh, click, pop, bildiriş) ────────────
let XC=null;
function sfx(n){const k={click:"sfxClick",whoosh:"sfxWhoosh",pop:"sfxPop",note:"sfxNote"}[n];if(!UI.sound||(k&&!UI[k]))return;
 try{XC=XC||new(window.AudioContext||window.webkitAudioContext)();if(XC.state==="suspended")XC.resume();const t=XC.currentTime,v=(UI.vol==null?60:UI.vol)/100,g=XC.createGain();g.connect(XC.destination);
  const tone=(f1,f2,d,ty,at,vo)=>{const o=XC.createOscillator(),e=XC.createGain();o.type=ty||"sine";o.frequency.setValueAtTime(f1,t+at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+at+d);e.gain.setValueAtTime(.0001,t+at);e.gain.exponentialRampToValueAtTime(Math.max(.0002,vo*v),t+at+.01);e.gain.exponentialRampToValueAtTime(.0001,t+at+d);o.connect(e);e.connect(g);o.start(t+at);o.stop(t+at+d+.03)};
