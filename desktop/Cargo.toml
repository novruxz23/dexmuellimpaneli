[package]
name = "dex-panel-desktop"
description = "DeX müəllim panelini (dexmuellimpaneli.vercel.app) ayrıca masaüstü tətbiq kimi açır"
version = "1.0.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
